<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>اهرب من الظل</title>
<style>
  :root{
    --cyan:#7df9ff;
    --violet:#8a3ffc;
    --ink:#05030d;
    --text:#e9f6ff;
    --mute:#8d93b5;
    --gold:#ffd86b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--text);
    font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ===== شريط المعلومات العلوي ===== */
  #hud{
    position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;
    justify-content:space-between;gap:12px;padding:12px 18px;pointer-events:none;
    transition:opacity .3s;
  }
  #hud.off{opacity:0}
  .stat{display:flex;flex-direction:column;gap:2px;min-width:84px}
  .stat small{font-size:13px;color:var(--mute)}
  .stat b{font-size:34px;line-height:1;font-weight:800;text-shadow:0 0 14px rgba(125,249,255,.55)}
  #bestBox{align-items:flex-start}
  #gemsBox{align-items:flex-start}
  #powerBox{flex:0 1 220px;align-items:stretch;padding-top:4px}
  #powerLabel{font-size:13px;color:var(--mute);text-align:center;transition:color .2s}
  #bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
  #barFill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#6b4bd6,var(--cyan));transition:width .1s linear}
  #powerBox.ready #powerLabel{color:var(--cyan)}
  #powerBox.active #powerLabel{color:#fff}
  #powerBox.active #barFill{background:linear-gradient(90deg,#9fd6ff,#ffffff)}

  #muteBtn{
    position:fixed;bottom:14px;left:14px;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(125,249,255,.35);background:rgba(10,6,32,.6);color:var(--text);
    font-size:18px;cursor:pointer;pointer-events:auto;
  }
  #muteBtn:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

  /* ===== الشاشات ===== */
  .panel{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at center,rgba(5,3,13,.25) 0%,rgba(5,3,13,.86) 100%);
    transition:opacity .35s,visibility .35s;
  }
  .panel.hidden{opacity:0;visibility:hidden;pointer-events:none}
  h1{
    font-size:clamp(46px,11vw,96px);font-weight:800;line-height:1.15;color:#eafcff;letter-spacing:0;
    text-shadow:0 0 10px var(--cyan),0 0 36px rgba(125,249,255,.55),0 0 90px var(--violet);
    animation:breathe 4.5s ease-in-out infinite;
  }
  h2{
    font-size:clamp(34px,8vw,64px);font-weight:800;color:#f1e9ff;
    text-shadow:0 0 12px #b66bff,0 0 50px var(--violet);
  }
  @keyframes breathe{
    0%,100%{text-shadow:0 0 10px var(--cyan),0 0 36px rgba(125,249,255,.5),0 0 90px var(--violet)}
    50%{text-shadow:0 0 18px var(--cyan),0 0 56px rgba(125,249,255,.8),0 0 130px var(--violet)}
  }
  .lead{max-width:430px;font-size:17px;line-height:1.9;color:#c5cbe8}
  .lead b{color:var(--cyan);font-weight:700}
  button.main{
    margin-top:6px;padding:14px 48px;font-family:inherit;font-size:22px;font-weight:700;
    color:var(--text);cursor:pointer;border-radius:999px;border:1.5px solid var(--cyan);
    background:rgba(125,249,255,.08);box-shadow:0 0 22px rgba(125,249,255,.35),inset 0 0 18px rgba(125,249,255,.12);
    transition:background .2s,transform .15s,box-shadow .2s;
  }
  button.main:hover{background:rgba(125,249,255,.2);box-shadow:0 0 34px rgba(125,249,255,.6),inset 0 0 22px rgba(125,249,255,.2)}
  button.main:active{transform:scale(.97)}
  .scores{display:flex;gap:34px;justify-content:center}
  .scores div{display:flex;flex-direction:column;gap:4px}
  .scores small{font-size:14px;color:var(--mute)}
  .scores b{font-size:46px;line-height:1;font-weight:800}
  #recordTag{color:var(--gold);font-weight:700;font-size:18px;text-shadow:0 0 14px rgba(255,216,107,.7)}
  #recordTag.hidden{display:none}
  #menuBest{color:var(--mute);font-size:15px}

  @media (max-width:520px){
    .stat b{font-size:26px}
    #powerBox{flex-basis:130px}
  }
  @media (prefers-reduced-motion:reduce){
    h1{animation:none}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>


<div id="hud" class="off">
  <div class="stat" id="gemsBox"><small>الجواهر</small><b id="gemsVal">0</b></div>
  <div class="stat" id="powerBox">
    <div id="powerLabel">قوة التجميد لم تظهر بعد</div>
    <div id="bar"><div id="barFill"></div></div>
  </div>
  <div class="stat" id="bestBox"><small>الأعلى</small><b id="bestVal">0</b></div>
</div>

<button id="muteBtn" aria-label="كتم الصوت" title="كتم / تشغيل الصوت (M)">🔊</button>


<div class="panel" id="menu">
  <h1>اهرب من الظل</h1>
  <p class="lead">حرّك الشخصية بالأسهم أو <b>W A S D</b>، أو اسحب بإصبعك على الشاشة.<br>
  اجمع الجواهر قبل أن يلحق بك الظل. التقط <b>أيقونة الجليد</b> لتجميده ٣ ثوانٍ.</p>
  <button class="main" id="startBtn">ابدأ</button>
  <div id="menuBest"></div>
</div>


<div class="panel hidden" id="over">
  <h2>تم اصطيادك!</h2>
  <div class="scores">
    <div><small>جواهرك</small><b id="finalScore">0</b></div>
    <div><small>الأعلى</small><b id="finalBest">0</b></div>
  </div>
  <div id="recordTag" class="hidden">رقم قياسي جديد!</div>
  <button class="main" id="retryBtn">إعادة المحاولة</button>
</div>


<div class="panel hidden" id="pause">
  <h2>متوقفة مؤقتًا</h2>
  <p class="lead">اضغط <b>P</b> أو <b>Esc</b> للمتابعة.</p>
  <button class="main" id="resumeBtn">تابع</button>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   اهرب من الظل — لعبة ويب في ملف واحد (Canvas + Web Audio، بدون مكتبات)
   ===================================================================== */

/* ---------- عناصر الصفحة ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const el = {
  hud: $('hud'), gems: $('gemsVal'), best: $('bestVal'),
  powerBox: $('powerBox'), powerLabel: $('powerLabel'), barFill: $('barFill'),
  menu: $('menu'), over: $('over'), pause: $('pause'),
  finalScore: $('finalScore'), finalBest: $('finalBest'), recordTag: $('recordTag'),
  menuBest: $('menuBest'), mute: $('muteBtn')
};

/* ---------- أدوات رياضية ---------- */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function lerpAngle(a, b, t) {
  const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- ثوابت اللعبة ---------- */
const PLAYER = { r: 16, maxSpeed: 340, accel: 2100, idleDrag: 5.5, restitution: 0.45 };
const SHADOW = {
  r: 30,
  baseFactor: 0.72,     // سرعة الظل الأساسية كنسبة من أقصى سرعة اللاعب
  perGem: 0.02,         // +2% لكل جوهرة
  capFactor: 0.96,      // الظل لا يتجاوز هذه النسبة أبدًا (يمكن دائمًا الهرب)
  baseForce: 430,       // أقصى قوة توجيه (maxForce)
  forcePerGem: 0.03
};
const FREEZE_TIME = 3;      // مدة تجميد الظل بالثواني
const POWER_LIFE = 9;       // مدة بقاء أيقونة الجليد على الخريطة
const HUD_SAFE = 80;        // منطقة الشريط العلوي (لا تظهر فيها العناصر)

/* ---------- الحالة ---------- */
let W = 0, H = 0, DPR = 1;
let vigNormal = null, vigDanger = null;
let state = 'menu';         // menu | play | paused | over
let time = 0;
const player = { x: 0, y: 0, vx: 0, vy: 0, face: 0, dead: false };
const shadow = { x: 0, y: 0, vx: 0, vy: 0, appear: 0 };
let gemsCount = 0, gem = null, power = null;
let powerTimer = 12, powerInterval = 12;
let freezeT = 0, freezeBlend = 0;
let shake = 0, danger = 0, heartbeat = 0;
let newRecord = false;
const particles = [];
let best = 0;
try { best = parseInt(localStorage.getItem('highScore'), 10) || 0; } catch (e) {}

/* ---------- الصوت (Web Audio) ---------- */
let ac = null, muted = false;
function audioOn() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.15, slideTo = null, delay = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  gem(n)  { const f = 660 + (n % 7) * 70; tone(f, 0.12, 'sine', 0.18, f * 1.5); tone(f * 1.5, 0.2, 'sine', 0.12, null, 0.07); },
  power() { tone(300, 0.4, 'square', 0.08, 1400); tone(900, 0.25, 'sine', 0.12, 1800, 0.1); },
  thaw()  { tone(520, 0.18, 'triangle', 0.1, 240); },
  beat()  { tone(62, 0.14, 'sine', 0.28, 42); },
  death() { tone(190, 0.8, 'sawtooth', 0.22, 38); tone(95, 1.0, 'square', 0.1, 28); }
};

/* ---------- الجسيمات ---------- */
function burst(x, y, n, color, speed, size, opts = {}) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 700) particles.shift();
    const a = Math.random() * TAU, s = speed * rand(0.25, 1);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.4, 1) * (opts.life || 0.8), max: 0, size: rand(0.6, 1) * size,
      color, add: opts.add !== false, drag: opts.drag || 2.2, alpha: opts.alpha || 1
    });
    const p = particles[particles.length - 1]; p.max = p.life;
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    const k = Math.exp(-p.drag * dt);
    p.vx *= k; p.vy *= k;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles(additive) {
  ctx.globalCompositeOperation = additive ? 'lighter' : 'source-over';
  for (const p of particles) {
    if (p.add !== additive) continue;
    const a = p.life / p.max;
    ctx.globalAlpha = a * p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.3, p.size * (0.4 + 0.6 * a)), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- الإدخال ---------- */
const keys = new Set();
let joy = null;
const MOVE_KEYS = {
  ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r',
  ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd'
};
addEventListener('keydown', e => {
  if (MOVE_KEYS[e.code]) { keys.add(MOVE_KEYS[e.code]); e.preventDefault(); return; }
  if (e.code === 'Enter' || e.code === 'Space') {
    e.preventDefault();
    if (state === 'menu') startGame();
    else if (state === 'over' && !el.over.classList.contains('hidden')) startGame();
    else if (state === 'paused') togglePause();
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    togglePause();
  } else if (e.code === 'KeyM') {
    toggleMute();
  }
});
addEventListener('keyup', e => { if (MOVE_KEYS[e.code]) keys.delete(MOVE_KEYS[e.code]); });
addEventListener('blur', () => { keys.clear(); joy = null; if (state === 'play') togglePause(); });

canvas.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; }
});
const joyEnd = e => { if (joy && e.pointerId === joy.id) joy = null; };
canvas.addEventListener('pointerup', joyEnd);
canvas.addEventListener('pointercancel', joyEnd);

function inputVector() {
  let x = 0, y = 0;
  if (joy) {
    const dx = (joy.x - joy.ox) / 55, dy = (joy.y - joy.oy) / 55;
    const l = Math.hypot(dx, dy);
    if (l > 0.14) { const k = Math.min(1, l) / l; x = dx * k; y = dy * k; }
  } else {
    if (keys.has('l')) x -= 1;
    if (keys.has('r')) x += 1;
    if (keys.has('u')) y -= 1;
    if (keys.has('d')) y += 1;
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
  }
  return { x, y };
}

/* ---------- تهيئة الشاشة ---------- */
function makeVignette(edgeColor, edgeAlpha) {
  const c = document.createElement('canvas');
  c.width = Math.max(2, W); c.height = Math.max(2, H);
  const g = c.getContext('2d');
  const r = Math.hypot(W, H) / 2;
  const gr = g.createRadialGradient(W / 2, H / 2, r * 0.38, W / 2, H / 2, r);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, `rgba(${edgeColor},${edgeAlpha})`);
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  return c;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vigNormal = makeVignette('0,0,6', 0.92);
  vigDanger = makeVignette('190,10,70', 0.75);
  player.x = clamp(player.x, PLAYER.r, W - PLAYER.r);
  player.y = clamp(player.y, PLAYER.r, H - PLAYER.r);
  shadow.x = clamp(shadow.x, SHADOW.r, W - SHADOW.r);
  shadow.y = clamp(shadow.y, SHADOW.r, H - SHADOW.r);
}
addEventListener('resize', resize);

/* ---------- منطق اللعبة ---------- */
function shadowMaxSpeed() {
  const f = Math.min(SHADOW.capFactor, SHADOW.baseFactor * (1 + SHADOW.perGem * gemsCount));
  return PLAYER.maxSpeed * f;
}
function shadowMaxForce() {
  return SHADOW.baseForce * Math.min(2, 1 + SHADOW.forcePerGem * gemsCount);
}
function freePoint(minFromPlayer, minFromShadow) {
  let x = W / 2, y = H / 2;
  for (let i = 0; i < 40; i++) {
    x = rand(50, W - 50); y = rand(HUD_SAFE, H - 50);
    if (Math.hypot(x - player.x, y - player.y) > minFromPlayer &&
        Math.hypot(x - shadow.x, y - shadow.y) > minFromShadow) break;
  }
  return { x, y };
}
function spawnGem() {
  const p = freePoint(Math.min(200, W * 0.3), 120);
  const hues = [175, 290, 45, 330, 140, 210];
  gem = { x: p.x, y: p.y, h: hues[Math.floor(Math.random() * hues.length)], born: time, phase: rand(0, TAU) };
}
function spawnPower() {
  const p = freePoint(Math.min(180, W * 0.25), 140);
  power = { x: p.x, y: p.y, life: POWER_LIFE, born: time };
}
function nextPowerDelay() {
  // كلما زادت الجواهر أصبحت قوة الطوارئ أندر (حتى الضعف) لرفع الصعوبة
  return rand(10, 15) * Math.min(2, 1 + 0.03 * gemsCount);
}

function reset() {
  gemsCount = 0; freezeT = 0; freezeBlend = 0; shake = 0; danger = 0; newRecord = false;
  particles.length = 0; power = null; joy = null;
  player.x = W / 2; player.y = H / 2; player.vx = player.vy = 0; player.face = 0; player.dead = false;
  const a = rand(0, TAU), d = Math.min(W, H) * 0.42 + 70;
  shadow.x = clamp(W / 2 + Math.cos(a) * d, 40, W - 40);
  shadow.y = clamp(H / 2 + Math.sin(a) * d, 40, H - 40);
  shadow.vx = shadow.vy = 0; shadow.appear = 0;
  powerInterval = powerTimer = nextPowerDelay();
  spawnGem();
}

function startGame() {
  audioOn();
  reset();
  state = 'play';
  el.menu.classList.add('hidden');
  el.over.classList.add('hidden');
  el.pause.classList.add('hidden');
  el.hud.classList.remove('off');
}
function togglePause() {
  if (state === 'play') { state = 'paused'; el.pause.classList.remove('hidden'); }
  else if (state === 'paused') { state = 'play'; el.pause.classList.add('hidden'); }
}
function toggleMute() {
  muted = !muted;
  el.mute.textContent = muted ? '🔇' : '🔊';
}
function die() {
  state = 'over';
  player.dead = true;
  shake = reduceMotion ? 6 : 24;
  burst(player.x, player.y, 46, '#7df9ff', 360, 4);
  burst(player.x, player.y, 40, '#2a0a55', 260, 9, { add: false, life: 1.2 });
  sfx.death();
  if (gemsCount > best) {
    best = gemsCount; newRecord = true;
    try { localStorage.setItem('highScore', String(best)); } catch (e) {}
  }
  el.finalScore.textContent = gemsCount;
  el.finalBest.textContent = best;
  el.recordTag.classList.toggle('hidden', !newRecord);
  setTimeout(() => { if (state === 'over') el.over.classList.remove('hidden'); }, 850);
}

function update(dt) {
  time += dt;
  freezeBlend = lerp(freezeBlend, freezeT > 0 ? 1 : 0, 1 - Math.exp(-6 * dt));
  shake = Math.max(0, shake - dt * 38);

  if (state === 'menu') {
    // عرض تمهيدي: الظل يدور حول اللاعب
    player.x = W / 2; player.y = H / 2 + 20;
    shadow.appear = 1;
    shadow.x = player.x + Math.cos(time * 0.55) * Math.min(220, W * 0.32);
    shadow.y = player.y + Math.sin(time * 0.55) * Math.min(150, H * 0.2);
    shadow.vx = -Math.sin(time * 0.55) * 90; shadow.vy = Math.cos(time * 0.55) * 60;
    player.face = lerpAngle(player.face, Math.atan2(shadow.y - player.y, shadow.x - player.x), 0.05);
    updateParticles(dt);
    return;
  }

  if (state === 'over') {
    shadow.vx *= Math.exp(-2 * dt); shadow.vy *= Math.exp(-2 * dt);
    shadow.x += shadow.vx * dt; shadow.y += shadow.vy * dt;
    updateParticles(dt);
    return;
  }

  /* --- اللاعب: تسارع + احتكاك --- */
  const inp = inputVector();
  const hasInput = inp.x !== 0 || inp.y !== 0;
  if (hasInput) {
    player.vx += inp.x * PLAYER.accel * dt;
    player.vy += inp.y * PLAYER.accel * dt;
    const k = Math.exp(-0.9 * dt); player.vx *= k; player.vy *= k;
  } else {
    const k = Math.exp(-PLAYER.idleDrag * dt); player.vx *= k; player.vy *= k;
  }
  let sp = Math.hypot(player.vx, player.vy);
  if (sp > PLAYER.maxSpeed) { player.vx *= PLAYER.maxSpeed / sp; player.vy *= PLAYER.maxSpeed / sp; sp = PLAYER.maxSpeed; }
  player.x += player.vx * dt; player.y += player.vy * dt;
  if (sp > 25) player.face = lerpAngle(player.face, Math.atan2(player.vy, player.vx), 1 - Math.exp(-12 * dt));

  /* تصادم مرن مع حدود الشاشة (ارتداد + انزلاق) */
  const r = PLAYER.r;
  if (player.x < r)     { player.x = r;     player.vx =  Math.abs(player.vx) * PLAYER.restitution; }
  if (player.x > W - r) { player.x = W - r; player.vx = -Math.abs(player.vx) * PLAYER.restitution; }
  if (player.y < r)     { player.y = r;     player.vy =  Math.abs(player.vy) * PLAYER.restitution; }
  if (player.y > H - r) { player.y = H - r; player.vy = -Math.abs(player.vy) * PLAYER.restitution; }

  /* أثر اللاعب */
  if (sp > 140 && Math.random() < 0.7) {
    burst(player.x - player.vx * 0.02, player.y - player.vy * 0.02, 1, '#7df9ff', 16, 5, { life: 0.45, alpha: 0.6 });
  }

  /* --- الظل: Seek مع قصور ذاتي --- */
  shadow.appear = Math.min(1, shadow.appear + dt / 1.1);
  if (freezeT > 0) {
    freezeT -= dt;
    const k = Math.exp(-9 * dt); shadow.vx *= k; shadow.vy *= k;
    if (Math.random() < 0.35) burst(shadow.x + rand(-26, 26), shadow.y + rand(-26, 26), 1, '#cfe8ff', 30, 3, { life: 0.7 });
    if (freezeT <= 0) { freezeT = 0; sfx.thaw(); burst(shadow.x, shadow.y, 22, '#cfe8ff', 160, 3); }
  } else if (shadow.appear >= 1) {
    const maxS = shadowMaxSpeed(), maxF = shadowMaxForce();
    // نتوقع موضع اللاعب قليلًا للأمام فيبدو الظل أذكى
    const tx = player.x + player.vx * 0.12, ty = player.y + player.vy * 0.12;
    let dx = tx - shadow.x, dy = ty - shadow.y;
    const dl = Math.hypot(dx, dy) || 1;
    dx = dx / dl * maxS; dy = dy / dl * maxS;               // السرعة المطلوبة
    let fx = dx - shadow.vx, fy = dy - shadow.vy;           // قوة التوجيه
    const fl = Math.hypot(fx, fy);
    if (fl > maxF) { fx *= maxF / fl; fy *= maxF / fl; }    // maxForce
    shadow.vx += fx * dt; shadow.vy += fy * dt;
    const ss = Math.hypot(shadow.vx, shadow.vy);
    if (ss > maxS) { shadow.vx *= maxS / ss; shadow.vy *= maxS / ss; }
  }
  shadow.x += shadow.vx * dt; shadow.y += shadow.vy * dt;
  const sr = SHADOW.r;
  if (shadow.x < sr)     { shadow.x = sr;     shadow.vx = Math.abs(shadow.vx) * 0.3; }
  if (shadow.x > W - sr) { shadow.x = W - sr; shadow.vx = -Math.abs(shadow.vx) * 0.3; }
  if (shadow.y < sr)     { shadow.y = sr;     shadow.vy = Math.abs(shadow.vy) * 0.3; }
  if (shadow.y > H - sr) { shadow.y = H - sr; shadow.vy = -Math.abs(shadow.vy) * 0.3; }
  if (freezeT <= 0 && shadow.appear > 0.3 && Math.random() < 0.5) {
    burst(shadow.x + rand(-18, 18), shadow.y + rand(-18, 18), 1, '#3a1470', 14, 10, { add: false, life: 0.7, alpha: 0.35 });
  }

  /* --- القرب والخطر --- */
  const dist = Math.hypot(player.x - shadow.x, player.y - shadow.y);
  danger = freezeT > 0 ? 0 : clamp(1 - (dist - 60) / 200, 0, 1);
  if (danger > 0.35 && !reduceMotion) shake = Math.max(shake, danger * 3.5);
  if (danger > 0.2) {
    heartbeat -= dt;
    if (heartbeat <= 0) { sfx.beat(); heartbeat = lerp(0.75, 0.3, danger); }
  }

  /* --- الاصطياد --- */
  if (freezeT <= 0 && shadow.appear >= 1 && dist < PLAYER.r + SHADOW.r * 0.62) { die(); return; }

  /* --- الجوهرة --- */
  if (gem && Math.hypot(player.x - gem.x, player.y - gem.y) < PLAYER.r + 16) {
    gemsCount++;
    sfx.gem(gemsCount);
    burst(gem.x, gem.y, 30, `hsl(${gem.h},100%,70%)`, 300, 4);
    burst(gem.x, gem.y, 10, '#ffffff', 200, 2.5);
    if (!reduceMotion) shake = Math.max(shake, 5);
    spawnGem();
  }

  /* --- قوة الطوارئ --- */
  if (!power && freezeT <= 0) {
    powerTimer -= dt;
    if (powerTimer <= 0) spawnPower();
  }
  if (power) {
    power.life -= dt;
    if (power.life <= 0) { power = null; powerInterval = powerTimer = nextPowerDelay(); }
    else if (Math.hypot(player.x - power.x, player.y - power.y) < PLAYER.r + 18) {
      burst(power.x, power.y, 36, '#bfe6ff', 300, 4);
      freezeT = FREEZE_TIME;
      sfx.power();
      if (!reduceMotion) shake = Math.max(shake, 8);
      power = null; powerInterval = powerTimer = nextPowerDelay();
    }
  }

  updateParticles(dt);
}

/* ---------- الرسم ---------- */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c0724'); g.addColorStop(1, '#04020b');
  ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);

  if (freezeBlend > 0.01) {   // تحول لوني أزرق/بنفسجي عند التجميد
    ctx.fillStyle = `rgba(50,80,255,${0.2 * freezeBlend})`;
    ctx.fillRect(-40, -40, W + 80, H + 80);
    ctx.fillStyle = `rgba(140,70,255,${0.1 * freezeBlend})`;
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }

  // شبكة بطبقتين لإعطاء عمق (Parallax)
  const layers = [{ s: 56, a: 0.055, f: 0.03, v: 5 }, { s: 168, a: 0.09, f: 0.09, v: 11 }];
  ctx.lineWidth = 1;
  for (const L of layers) {
    ctx.strokeStyle = `rgba(125,249,255,${L.a})`;
    const ox = (-(player.x * L.f) - time * L.v) % L.s, oy = (-(player.y * L.f) - time * L.v * 0.6) % L.s;
    ctx.beginPath();
    for (let x = ox - L.s; x < W + L.s; x += L.s) { ctx.moveTo(x, -L.s); ctx.lineTo(x, H + L.s); }
    for (let y = oy - L.s; y < H + L.s; y += L.s) { ctx.moveTo(-L.s, y); ctx.lineTo(W + L.s, y); }
    ctx.stroke();
  }
}

function drawPlayerLight() {
  if (player.dead) return;
  const r = 300 + Math.sin(time * 2.4) * 14;
  const g = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, r);
  g.addColorStop(0, 'rgba(125,249,255,0.20)');
  g.addColorStop(0.5, 'rgba(90,150,255,0.07)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(player.x - r, player.y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = 'source-over';
}

function drawGem(g) {
  const k = Math.min(1, (time - g.born) / 0.35);
  const s = k * (1 + 0.08 * Math.sin(time * 4));
  const bob = Math.sin(time * 2 + g.phase) * 3;
  ctx.save();
  ctx.translate(g.x, g.y + bob);
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 48 * s);
  gl.addColorStop(0, `hsla(${g.h},100%,70%,.45)`);
  gl.addColorStop(1, `hsla(${g.h},100%,70%,0)`);
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 48 * s, 0, TAU); ctx.fill();

  ctx.rotate(Math.sin(time * 1.3 + g.phase) * 0.15);
  ctx.scale(s * Math.max(0.2, Math.abs(Math.cos(time * 2.2 + g.phase))), s);   // دوران وهمي حول المحور العمودي
  const w = 13, h = 18;
  ctx.shadowBlur = 22; ctx.shadowColor = `hsl(${g.h},100%,65%)`;
  const fg = ctx.createLinearGradient(0, -h, 0, h);
  fg.addColorStop(0, `hsl(${g.h},100%,88%)`);
  fg.addColorStop(0.5, `hsl(${g.h},95%,60%)`);
  fg.addColorStop(1, `hsl(${g.h + 30},90%,40%)`);
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(w, 0); ctx.lineTo(0, h); ctx.lineTo(-w, 0); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(w, 0); ctx.lineTo(-w, 0); ctx.closePath(); ctx.fill();
  ctx.restore();

  // بريق متلألئ
  for (let i = 0; i < 3; i++) {
    const a = time * 1.5 + i * 2.1 + g.phase, rr = 28 + 6 * Math.sin(time * 3 + i);
    const tw = (Math.sin(time * 6 + i * 1.9) + 1) / 2;
    const sx = g.x + Math.cos(a) * rr, sy = g.y + Math.sin(a) * rr * 0.8, z = (2 + 3 * tw) * k;
    ctx.globalAlpha = tw * 0.9; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(sx, sy - z * 1.6); ctx.lineTo(sx + z * 0.5, sy); ctx.lineTo(sx, sy + z * 1.6); ctx.lineTo(sx - z * 0.5, sy); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - z * 1.6, sy); ctx.lineTo(sx, sy + z * 0.5); ctx.lineTo(sx + z * 1.6, sy); ctx.lineTo(sx, sy - z * 0.5); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPower(p) {
  const blink = p.life < 2.5 ? (Math.sin(time * 14) > 0 ? 1 : 0.25) : 1;
  const pulse = 1 + 0.1 * Math.sin(time * 5);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.globalAlpha = blink;
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 56 * pulse);
  gl.addColorStop(0, 'rgba(190,230,255,.5)'); gl.addColorStop(1, 'rgba(190,230,255,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 56 * pulse, 0, TAU); ctx.fill();

  ctx.shadowBlur = 20; ctx.shadowColor = '#9fd6ff';
  ctx.strokeStyle = '#e8f6ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 19 * pulse, 0, TAU); ctx.stroke();
  ctx.rotate(time * 0.8);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    ctx.rotate(TAU / 6);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -12); ctx.moveTo(0, -7); ctx.lineTo(4, -10); ctx.moveTo(0, -7); ctx.lineTo(-4, -10); ctx.stroke();
  }
  ctx.restore();
}

function blobPath(x, y, r, t, wob) {
  const N = 40;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU;
    const rr = r * (1 + wob * (0.55 * Math.sin(a * 3 + t * 2.2) + 0.3 * Math.sin(a * 5 - t * 3.1) + 0.15 * Math.sin(a * 7 + t * 4.3)));
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawShadow() {
  const s = shadow, f = freezeBlend, ap = s.appear;
  if (ap <= 0.01) return;
  const r = SHADOW.r * (0.55 + 0.45 * ap);
  const ex = player.x - s.x, ey = player.y - s.y, el_ = Math.hypot(ex, ey) || 1;
  const nx = ex / el_, ny = ey / el_;
  ctx.save();
  ctx.globalAlpha = ap;

  // هالة الظل
  const aura = ctx.createRadialGradient(s.x, s.y, r * 0.5, s.x, s.y, r * 3.6);
  aura.addColorStop(0, `rgba(${lerp(138, 160, f) | 0},${lerp(63, 190, f) | 0},${lerp(252, 255, f) | 0},.38)`);
  aura.addColorStop(0.45, `rgba(${lerp(70, 110, f) | 0},${lerp(20, 140, f) | 0},${lerp(140, 200, f) | 0},.16)`);
  aura.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(s.x, s.y, r * 3.6, 0, TAU); ctx.fill();

  // الظلمة التي تمتص الضوء المحيط
  const dark = ctx.createRadialGradient(s.x, s.y, r * 0.8, s.x, s.y, r * 2.3);
  dark.addColorStop(0, `rgba(0,0,0,${0.7 * (1 - f * 0.6)})`); dark.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.3, 0, TAU); ctx.fill();

  // الجسم
  const body = ctx.createRadialGradient(s.x - nx * -2, s.y - ny * -2, 0, s.x, s.y, r * 1.2);
  body.addColorStop(0, f > 0.5 ? '#3a4054' : '#000000');
  body.addColorStop(0.65, f > 0.5 ? '#555c73' : '#120524');
  body.addColorStop(1, f > 0.5 ? '#7b839c' : '#2a0e52');
  ctx.shadowBlur = 30; ctx.shadowColor = f > 0.5 ? '#a8c8ff' : '#7b2cff';
  ctx.fillStyle = body;
  blobPath(s.x, s.y, r, time, f > 0.5 ? 0.03 : 0.12);
  ctx.fill();
  ctx.shadowBlur = 0;

  // العينان
  const px = -ny, py = nx;
  ctx.strokeStyle = ctx.fillStyle = f > 0.5 ? '#dbe8ff' : '#d3a8ff';
  ctx.shadowBlur = 12; ctx.shadowColor = f > 0.5 ? '#ffffff' : '#b66bff';
  for (const sgn of [-1, 1]) {
    const ex2 = s.x + nx * r * 0.28 + px * sgn * r * 0.32, ey2 = s.y + ny * r * 0.28 + py * sgn * r * 0.32;
    if (f > 0.5) {  // عيون مغلقة عند التجميد
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ex2 - 4, ey2); ctx.lineTo(ex2 + 4, ey2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(ex2, ey2, 3.2, 4.6, Math.atan2(ny, nx), 0, TAU); ctx.fill();
    }
  }
  ctx.shadowBlur = 0;

  // حلقة الجليد
  if (f > 0.05) {
    ctx.globalAlpha = ap * Math.min(1, f);
    ctx.strokeStyle = 'rgba(190,225,255,.7)'; ctx.lineWidth = 2;
    ctx.setLineDash([7, 9]); ctx.lineDashOffset = -time * 14;
    ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.55, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawPlayer() {
  if (player.dead) return;
  const p = player, pulse = 1 + 0.06 * Math.sin(time * 5);
  const aura = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, PLAYER.r * 3.4 * pulse);
  aura.addColorStop(0, 'rgba(125,249,255,.5)');
  aura.addColorStop(0.4, 'rgba(125,249,255,.15)');
  aura.addColorStop(1, 'rgba(125,249,255,0)');
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(p.x, p.y, PLAYER.r * 3.4 * pulse, 0, TAU); ctx.fill();

  const body = ctx.createRadialGradient(p.x - 4, p.y - 5, 1, p.x, p.y, PLAYER.r);
  body.addColorStop(0, '#ffffff'); body.addColorStop(0.55, '#aef6ff'); body.addColorStop(1, '#3fd3f0');
  ctx.shadowBlur = 26; ctx.shadowColor = '#7df9ff';
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(p.x, p.y, PLAYER.r, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;

  // العينان باتجاه الحركة
  const fx = Math.cos(p.face), fy = Math.sin(p.face), qx = -fy, qy = fx;
  ctx.fillStyle = '#0a1a33';
  for (const sgn of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(p.x + fx * 6 + qx * sgn * 5, p.y + fy * 6 + qy * sgn * 5, 2.4, 0, TAU);
    ctx.fill();
  }
}

function drawJoystick() {
  if (!joy || state !== 'play') return;
  const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), m = Math.min(l, 55) / (l || 1);
  ctx.strokeStyle = 'rgba(125,249,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 55, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(125,249,255,.35)';
  ctx.beginPath(); ctx.arc(joy.ox + dx * m, joy.oy + dy * m, 20, 0, TAU); ctx.fill();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.05 && !reduceMotion) ctx.translate(rand(-shake, shake), rand(-shake, shake));   // اهتزاز الشاشة

  drawBackground();
  drawPlayerLight();
  drawParticles(true);
  if (gem && state !== 'menu') drawGem(gem);
  if (power) drawPower(power);
  drawShadow();
  drawParticles(false);
  drawPlayer();
  ctx.restore();

  // تظليل الحواف (Vignette) + وميض الخطر
  ctx.drawImage(vigNormal, 0, 0, W, H);
  if (danger > 0.02) {
    ctx.globalAlpha = danger * (0.7 + 0.3 * Math.sin(time * 14));
    ctx.drawImage(vigDanger, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  drawJoystick();
}

/* ---------- تحديث الواجهة ---------- */
let lastGems = -1, lastBest = -1, lastLabel = '';
function updateHud() {
  if (gemsCount !== lastGems) { el.gems.textContent = gemsCount; lastGems = gemsCount; }
  if (best !== lastBest) { el.best.textContent = best; lastBest = best; }
  let label, frac, cls = '';
  if (freezeT > 0)      { label = 'الظل متجمّد'; frac = freezeT / FREEZE_TIME; cls = 'active'; }
  else if (power)       { label = 'أيقونة الجليد ظهرت! التقطها'; frac = power.life / POWER_LIFE; cls = 'ready'; }
  else                  { label = 'قوة التجميد لم تظهر بعد'; frac = 1 - powerTimer / powerInterval; }
  if (label !== lastLabel) {
    el.powerLabel.textContent = label; lastLabel = label;
    el.powerBox.className = 'stat ' + cls;
  }
  el.barFill.style.width = (clamp(frac, 0, 1) * 100).toFixed(1) + '%';
}

/* ---------- الحلقة الرئيسية ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (state !== 'paused') update(dt);
  render();
  if (state === 'play' || state === 'over') updateHud();
  requestAnimationFrame(frame);
}

/* ---------- ربط الأزرار والبدء ---------- */
$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', togglePause);
el.mute.addEventListener('click', toggleMute);
document.addEventListener('contextmenu', e => e.preventDefault());

if (best > 0) el.menuBest.textContent = 'أعلى نتيجة: ' + best;
el.best.textContent = best;
resize();
reset();
state = 'menu';
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
